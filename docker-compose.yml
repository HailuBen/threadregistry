version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: threadregistry-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: threadregistry
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: threadregistry-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      MYSQL_HOST: mysql
      MYSQL_DB: threadregistry
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: